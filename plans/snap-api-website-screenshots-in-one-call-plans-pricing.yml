credit_rules:
  - Each successful capture consumes one credit.
  - A cache HIT within the <=1 hour render window does not consume a credit.
  - A failed capture does not consume a credit.
  - Extra credits (one-time top-ups) have a separate lifecycle from monthly allowance.
