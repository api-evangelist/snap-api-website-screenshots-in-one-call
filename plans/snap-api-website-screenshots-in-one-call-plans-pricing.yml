summary: >-
  Snap API publishes three self-serve tiers with public prices and monthly screenshot quotas: a
  perpetual free Developer tier (200/month, not a trial), Starter at $9/mo (5,000), and Growth at
  $29/mo (30,000). Billing runs through Stripe Checkout (buy.stripe.com links in the site footer).
  Optional one-time credit top-ups are offered when a plan's monthly allowance is exceeded. Pricing
  is metered per successful screenshot; a cache HIT within the ≤1h window and a failed capture do
  not consume a credit.
