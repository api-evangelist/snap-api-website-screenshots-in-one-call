server:
  name: snap-api
  transport: null
  url: null
tools:
  - name: take_screenshot
    description: >-
      Capture a screenshot or PDF of a public URL with a Chromium engine. Returns binary image/PDF
      (or JSON data-URL with output=json). Consumes one credit per successful capture; cache HIT
      within <=1h does not.
    source_operation: docs.html#GET /v1/take (alias /v1/render)
    proposed_operation_id: takeScreenshot
    auth: api-key
    inputs_from_docs:
      required: [url]
      optional: [width, height, full_page, file_type, quality, pdf_format, device_scale_factor, wait_until, wait_for_selector, delay, block_cookie_banners, block_ads, scroll_to_load, output, cache]
  - name: record
    description: Record a scroll/video capture of a public URL.
    source_operation: docs.html#GET /v1/record
    proposed_operation_id: record
    auth: api-key
    inputs_from_docs:
      required: [url]
      optional: [record_video, width, height, wait_until, delay]
  - name: get_usage
    description: Return the authenticated key's plan and remaining monthly credits.
    source_operation: docs.html#GET /v1/usage
    proposed_operation_id: getUsage
    auth: api-key
    inputs_from_docs:
      required: []
      optional: []
