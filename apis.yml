name: Snap API
description: >-
  Single-endpoint website-screenshot and rendering service that captures any public URL with a Chromium engine,
  returning PNG/JPEG/WebP images, PDFs, or scroll/video recordings via one GET request. Designed for developers, n8n
  workflows, and automated pipelines. API-key authenticated (query param, X-API-Key header, or Authorization Bearer)
  with a perpetual free tier of 200 screenshots/month and paid Starter/Growth plans, a <=1h render cache, and credit
  metering exposed at /v1/usage.
